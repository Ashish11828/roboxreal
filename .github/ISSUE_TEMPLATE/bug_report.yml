name: Bug report
description: Report a reproducible problem with this project.
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest example that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the commit, OS, runtime or SDK, and device or browser where relevant.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove credentials and personal information before sharing.
